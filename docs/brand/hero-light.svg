<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Elenvar">
<style>
text { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.title { font-weight: 800; font-size: 100px; letter-spacing: 8px; fill: #101c2f; }
.tag { font-weight: 600; font-size: 24px; fill: #5b6475; letter-spacing: .2px; }
.osd { font-family: Menlo, Consolas, monospace; font-size: 5px; fill: #e8eaee; }
.label { font-weight: 700; font-size: 8px; fill: #c9d1dc; }
.small { font-weight: 600; font-size: 6px; fill: #7f8a9c; }
.ok { font-weight: 800; font-size: 8px; fill: #30d158; }
.alert { font-weight: 800; font-size: 9px; fill: #ff6961; text-anchor: middle; letter-spacing: 1px; }
.stroke { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s cubic-bezier(.6,0,.3,1) forwards; }
.lid { fill-opacity: 0; stroke: #1c2433; stroke-width: 2.5; animation: draw 1.4s cubic-bezier(.6,0,.3,1) forwards, fill .7s 1.1s ease-out forwards; }
.iris { transform-origin: 0 0; transform: scaleY(0); animation: open .6s 1.2s cubic-bezier(.2,.9,.3,1.2) forwards; }
.star { transform-origin: 0 0; animation: spin 40s 1.8s linear infinite; }
.blink { transform-origin: 0 0; animation: blink 12s 4s ease-in-out infinite; }
.glow { opacity: 0; animation: glow 5s 2.4s ease-in-out infinite; }
.words { opacity: 0; animation: rise .8s 1.3s cubic-bezier(.2,.8,.2,1) forwards; }
.tagline { opacity: 0; animation: rise .8s 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
.screen { opacity: 0; animation: pop .6s cubic-bezier(.2,.9,.3,1.2) forwards; }
.car { animation: drive 6s linear infinite; }
.cursor { animation: scrub 8s linear infinite; }
.bar { transform-origin: 0 0; transform: scaleX(.72); }
.dot { animation: pulse 2.8s ease-in-out infinite; }
.bad { animation-duration: 1.2s; }
.rec { animation: pulse 1.2s steps(2) infinite; }
.motion { animation: pulse 1.6s ease-in-out infinite; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fill { to { fill-opacity: 1; stroke-opacity: 0; } }
@keyframes open { to { transform: scaleY(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 97.5% { transform: scaleY(.05); } }
@keyframes glow { 0%, 100% { opacity: 0; } 50% { opacity: .5; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.92); } to { opacity: 1; transform: none; } }
@keyframes drive { from { transform: translateX(0); } to { transform: translateX(130px); } }
@keyframes scrub { from { transform: translateX(0); } to { transform: translateX(78px); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) {
  .stroke, .lid { animation: none; stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0; }
  .iris { animation: none; transform: none; }
  .words, .tagline, .screen { animation: none; opacity: 1; }
  .star, .blink, .glow, .car, .cursor, .dot, .rec, .motion { animation: none; }
}
</style>
<defs>
