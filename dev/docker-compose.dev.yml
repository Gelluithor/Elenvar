# Development extension: adds a Hikvision NVR simulator.
#   docker compose -f docker-compose.yml -f dev/docker-compose.dev.yml up -d --build
# In the app, add a device with host "mock-nvr", user "admin", password "p@ss:w/rd".
services:
  mock-nvr:
    build: ./dev/mock-nvr
    restart: unless-stopped
    networks: [backend]
