# Demo with two simulated NVRs. Started by dev/demo.sh.
# The app is reachable only from this computer at http://localhost:8080 (no Caddy/HTTPS).
services:
  app:
    ports:
      - "127.0.0.1:${ELENVAR_DEMO_PORT:-8080}:8000"
    environment:
      ELENVAR_COOKIE_SECURE: "false"
      ELENVAR_ADMIN_USERNAME: admin
      ELENVAR_ADMIN_PASSWORD: "Elenvar-Demo-2026"

  caddy:
    profiles: ["https"]

  mock-areal:
    build: ./dev/mock-nvr
    image: elenvar-mock-nvr:dev
    restart: unless-stopped
    environment:
      TZ: Europe/Prague
      MOCK_DEVICE_NAME: "Areál Brno"
      MOCK_MODEL: "DS-7608NXI-K2"
      MOCK_CHANNELS: "Vjezd,Parkoviště,Sklad,Recepce"
      MOCK_OFFLINE: "3"
      MOCK_NOISE: "0"
    networks: [backend]

  mock-sklad:
    build: ./dev/mock-nvr
    image: elenvar-mock-nvr:dev
    restart: unless-stopped
    environment:
      TZ: Europe/Prague
      MOCK_DEVICE_NAME: "Sklad Ostrava"
      MOCK_MODEL: "DS-7616NI-K2"
      MOCK_CHANNELS: "Rampa,Brána sever,Hala B,Kancelář"
      MOCK_OFFLINE: ""
      MOCK_NOISE: "0"
    networks: [backend]
